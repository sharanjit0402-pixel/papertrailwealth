<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8E7"/><stop offset="1" stop-color="#FDECC8"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="110" fill="#B45309" font-size="26" font-weight="700" letter-spacing="5">THE SURPRISE BILL TEST</text>
  <text x="80" y="220" fill="#14171A" font-size="86" font-weight="800" letter-spacing="-2.5">1 in 3 Americans can't</text>
  <text x="80" y="315" fill="#14171A" font-size="86" font-weight="800" letter-spacing="-2.5">cover a <tspan fill="#B45309">$400</tspan> surprise.</text>
  <g transform="translate(80,420) rotate(-3)">
    <rect width="430" height="400" rx="10" fill="#ffffff" stroke="#14171A" stroke-opacity="0.15" stroke-width="2"/>
    <text x="40" y="70" fill="#14171A" font-size="30" font-weight="800" letter-spacing="3">AUTO REPAIR</text>
    <line x1="40" y1="100" x2="390" y2="100" stroke="#14171A" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="40" y="160" fill="#6b7280" font-size="28" font-weight="600">Brake pads</text><text x="390" y="160" fill="#14171A" font-size="28" font-weight="700" text-anchor="end">$260</text>
    <text x="40" y="210" fill="#6b7280" font-size="28" font-weight="600">Labor</text><text x="390" y="210" fill="#14171A" font-size="28" font-weight="700" text-anchor="end">$140</text>
    <line x1="40" y1="250" x2="390" y2="250" stroke="#14171A" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="40" y="330" fill="#14171A" font-size="40" font-weight="800">TOTAL</text><text x="390" y="335" fill="#B45309" font-size="58" font-weight="800" text-anchor="end">$400</text>
  </g>
  <g transform="translate(640,470)">
    <text x="0" y="0" fill="#14171A" font-size="34" font-weight="800">Your emergency fund</text>
    <rect x="0" y="40" width="880" height="110" rx="55" fill="#ffffff" stroke="#B45309" stroke-width="5"/>
    <rect x="12" y="52" width="420" height="86" rx="43" fill="#B45309"/>
    <text x="0" y="210" fill="#B45309" font-size="44" font-weight="800">$0</text>
    <text x="880" y="210" fill="#B45309" font-size="44" font-weight="800" text-anchor="end">$1,000</text>
    <text x="0" y="300" fill="#14171A" font-size="40" font-weight="800">Start at zero. <tspan fill="#B45309">Build it step by step.</tspan></text>
  </g>
</svg>
