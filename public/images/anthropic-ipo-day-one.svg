<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1.6" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#0B3D26"/>
      <stop offset="0.45" stop-color="#145C3A"/>
      <stop offset="0.78" stop-color="#1F7A4D"/>
      <stop offset="1" stop-color="#34A871"/>
    </radialGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <text x="80" y="96" fill="#ffffff" fill-opacity="0.8" font-size="22" font-weight="700" letter-spacing="4">ANTHROPIC IPO · NASDAQ · NOV 19, 2026</text>
  <text x="80" y="172" fill="#ffffff" font-size="60" font-weight="800" letter-spacing="-1.5">The stock rose <tspan fill="#A7F3C9">17%</tspan> on day one.</text>
  <text x="80" y="242" fill="#ffffff" font-size="60" font-weight="800" letter-spacing="-1.5">Opening-trade buyers still lost money.</text>

  <g transform="translate(80,350)">
    <line x1="0" y1="330" x2="1440" y2="330" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M40 330 L560 330 L660 80 L720 66 L800 150 L880 190 L980 215 L1080 205 L1180 236 L1360 226 L1360 400 L40 400Z" fill="url(#fill)"/>
    <path d="M40 330 L560 330 L660 80 L720 66 L800 150 L880 190 L980 215 L1080 205 L1180 236 L1360 226" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="40" cy="330" r="12" fill="#A7F3C9"/>
    <circle cx="660" cy="80" r="14" fill="#ffffff" stroke="#0B3D26" stroke-width="5"/>
    <circle cx="1360" cy="226" r="12" fill="#A7F3C9"/>
    <text x="30" y="262" fill="#ffffff" font-size="44" font-weight="800">$83</text>
    <text x="30" y="292" fill="#ffffff" fill-opacity="0.85" font-size="20" font-weight="600">IPO price, mostly big funds</text>
    <text x="630" y="82" fill="#ffffff" font-size="44" font-weight="800" text-anchor="end">$111.50</text>
    <text x="630" y="112" fill="#ffffff" fill-opacity="0.85" font-size="20" font-weight="600" text-anchor="end">first public trade, 11:48 AM</text>
    <text x="1380" y="152" fill="#ffffff" font-size="44" font-weight="800" text-anchor="end">$97.17</text>
    <text x="1380" y="182" fill="#ffffff" fill-opacity="0.85" font-size="20" font-weight="600" text-anchor="end">closing bell</text>
  </g>

  <rect x="80" y="764" width="708" height="90" rx="20" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="106" y="817" fill="#ffffff" fill-opacity="0.85" font-size="20" font-weight="700" letter-spacing="1">GOT IT AT $83</text>
  <text x="762" y="824" fill="#ffffff" font-size="40" font-weight="800" text-anchor="end">+$14.17 / share</text>
  <rect x="812" y="764" width="708" height="90" rx="20" fill="#0A1F15" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="838" y="817" fill="#ffffff" fill-opacity="0.85" font-size="20" font-weight="700" letter-spacing="1">BOUGHT AT THE OPEN</text>
  <text x="1494" y="824" fill="#ffffff" font-size="40" font-weight="800" text-anchor="end">−$14.33 / share</text>
</svg>
