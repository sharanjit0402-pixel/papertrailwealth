<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233A"/><stop offset="1" stop-color="#0E1A2B"/></linearGradient>
    <linearGradient id="ga" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#86EFAC"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <text x="80" y="110" fill="#ffffff" fill-opacity="0.75" font-size="26" font-weight="700" letter-spacing="5">TWO SAVERS · VALUE AT AGE 65</text>
  <text x="80" y="225" fill="#ffffff" font-size="88" font-weight="800" letter-spacing="-3">Saved less.</text>
  <text x="80" y="320" fill="#86EFAC" font-size="88" font-weight="800" letter-spacing="-3">Ended with more.</text>
  <line x1="80" y1="820" x2="1520" y2="820" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>
  <rect x="860" y="400" width="260" height="420" rx="14" fill="url(#ga)"/>
  <rect x="1220" y="570" width="260" height="250" rx="14" fill="#94A3B8"/>
  <text x="990" y="380" fill="#86EFAC" font-size="48" font-weight="800" text-anchor="middle">$525K</text>
  <text x="1350" y="550" fill="#E2E8F0" font-size="48" font-weight="800" text-anchor="middle">$313K</text>
  <text x="990" y="862" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">$200/mo from 25</text>
  <text x="1350" y="862" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">$600/mo from 45</text>
  <text x="80" y="460" fill="#ffffff" fill-opacity="0.85" font-size="34" font-weight="600">Put in: $96,000</text>
  <text x="80" y="510" fill="#ffffff" fill-opacity="0.55" font-size="34" font-weight="600">vs $144,000</text>
  <text x="80" y="620" fill="#ffffff" fill-opacity="0.85" font-size="30" font-weight="600">Same 7% average return.</text>
  <text x="80" y="665" fill="#ffffff" fill-opacity="0.85" font-size="30" font-weight="600">The difference was time.</text>
</svg>
